
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آقا رضا | The Legend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div>

    <main class="container">

        <div class="top-label">⚡ SPECIAL EDITION ⚡</div>

        <h1 class="main-title">THE LEGEND</h1>

        <div class="photo-frame">
            <!-- عکس خودت را با نام reza.jpg کنار فایل HTML بگذار -->
            <img src="./photo_31213640270_x.jpg" alt="عکس آقا رضا">
            <div class="photo-glow"></div>
        </div>

        <h2 class="reza-name">عاقــا رضــا</h2>

        <p class="subtitle">
            درتو بزار 😂
        </p>

        <div class="divider"></div>

        <div class="funny-box">
            <span class="emoji">🤣</span>
            <p>هشدار! نزدیک شدن به این موجود ممکن است باعث خنده شدید شود!</p>
        </div>

        <div class="stats">
            <div class="stat">
                <span>100%</span>
                <small>دیوانگی</small>
            </div>

            <div class="stat">
                <span>999+</span>
                <small>سوتی</small>
            </div>

            <div class="stat">
                <span>∞</span>
                <small>رفاقت</small>
            </div>
        </div>

        <footer>
            MADE WITH 😂 FOR REZA
        </footer>

    </main>

</body>
</html>
